<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // TODO: create a handler

      function setSearchEngine() {
        console.log("I'm a searchEngine Function");
      }

      // TODO: register the handler
      window.addEventListener("load", function () {
        let actions = {
          google: "https://www.google.com/search",
          bing: "https://www.bing.com/search",
          duckduckgo: "https://duckduckgo.com/",
          yahoo: "https://search.yahoo.com/",
        };

        let form = document.getElementById("searchForm");

        form.addEventListener("submit", function () {
          let selectedEngine = document.querySelector(
            "input[name=engine]:checked"
          );

          let searchText = document.querySelector("input[name=q]");

          if (searchText.value === "") {
            alert("Please enter requred text");
          }

          if (!selectedEngine) {
            alert("Please select an option.");
          }

          let action = actions[selectedEngine.value];
          form.setAttribute("action", action);
        });
      });
    </script>
  </head>

  <body>
    <form id="searchForm">
      <input type="text" name="q" />
      <label><input type="radio" name="engine" value="google" /> Google</label>

      <label>
        <input type="radio" name="engine" value="duckDuckGo" />
        DuckDuckGo</label
      >

      <label><input type="radio" name="engine" value="bing" /> Bing</label>

      <label><input type="radio" name="engine" value="ask" /> Ask</label>

      <label><input type="submit" value="Go!" /></label>

      <!-- TODO: add form elements -->
    </form>
  </body>
</html>
